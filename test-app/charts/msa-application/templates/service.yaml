apiVersion: v1
kind: Service
metadata:
  name: {{ include "msa-application.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.global.targetNamespace }}
  labels:
    {{- include "msa-application.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "msa-application.selectorLabels" . | nindent 4 }}
