{{- if .Values.suseVirtualization.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-suse-virtualization" .Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ default .Release.Namespace .Values.global.targetNamespace }}
spec:
  podSelector:
    {{- toYaml .Values.suseVirtualization.networkPolicy.podSelector | nindent 4 }}
  policyTypes:
    {{- toYaml .Values.suseVirtualization.networkPolicy.policyTypes | nindent 4 }}
  {{- with .Values.suseVirtualization.networkPolicy.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.suseVirtualization.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
