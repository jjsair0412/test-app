apiVersion: v2
name: test-app
description: Umbrella chart for an MSA application, Kubernetes policies, and SUSE Virtualization VMs
type: application
version: 0.1.0
appVersion: "1.16.0"
dependencies:
  - name: msa-application
    alias: msa-app
    version: 0.1.0
    repository: file://charts/msa-application
    condition: msa-app.enabled
  - name: policy
    version: 0.1.0
    repository: file://charts/policy
    condition: policy.enabled
  - name: vm
    version: 0.1.0
    repository: file://charts/vm
    condition: vm.enabled
