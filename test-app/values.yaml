global:
  targetNamespace: ""

msa-app:
  enabled: true
  replicaCount: 2
  image:
    repository: nginx
    tag: "1.27"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  resources: {}
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http
  env:
    LOG_LEVEL: INFO
  config:
    EXTERNAL_API_URL: "https://api.example.com"
  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

policy:
  enabled: true
  namespace:
    create: false
    labels:
      pod-security.kubernetes.io/enforce: baseline
      pod-security.kubernetes.io/audit: restricted
      pod-security.kubernetes.io/warn: restricted
    annotations: {}
  msaApplication:
    networkPolicy:
      enabled: false
      podSelector:
        matchLabels: {}
      policyTypes:
        - Ingress
        - Egress
      ingress: []
      egress: []
  suseVirtualization:
    networkPolicy:
      enabled: false
      podSelector:
        matchLabels:
          kubevirt.io: virt-launcher
      policyTypes:
        - Ingress
        - Egress
      ingress: []
      egress: []

vm:
  enabled: true
  virtualizationVmi:
    enabled: false
    name: example-vmi
    labels: {}
    annotations: {}
    terminationGracePeriodSeconds: 30
    domain:
      cpu:
        cores: 1
      resources:
        requests:
          memory: 512Mi
      disks:
        - name: containerdisk
          disk:
            bus: virtio
      interfaces:
        - name: default
          masquerade: {}
    networks:
      - name: default
        pod: {}
    volumes:
      - name: containerdisk
        containerDisk:
          image: quay.io/containerdisks/cirros:0.6.2
